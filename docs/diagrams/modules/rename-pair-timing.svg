 .head{font-size:18px;font-weight:700} .label{font-size:18px;font-weight:700} .cell{font-size:15px}
 @media(prefers-color-scheme:dark){.bg{fill:#0f172a} .grid{fill:#111827;stroke:#94a3b8} .active{fill:#172554;stroke:#60a5fa} text{fill:#e5e7eb} .caption{fill:#cbd5e1}}
</style><rect width="1640" height="556" class="bg"/>
<text x="40" y="48" class="title">동일 bundle RAW/WAW rename</text><text x="40" y="82" class="caption">lane1은 lane0이 만든 working RAT을 보므로 같은 cycle dependency도 physical tag로 정확히 연결된다.</text><text x="401.0" y="130" text-anchor="middle" class="head">before</text><text x="743.0" y="130" text-anchor="middle" class="head">comb</text><text x="1085.0" y="130" text-anchor="middle" class="head">accept edge</text><text x="1427.0" y="130" text-anchor="middle" class="head">next cycle</text><text x="40" y="193" class="label">lane0</text><rect x="230" y="150" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="398" y="181" class="cell"><tspan x="398" dy="0">RAT[x5]=p7</tspan></text><rect x="572" y="150" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="740" y="181" class="cell"><tspan x="740" dy="0">ADD x5→p40</tspan></text><rect x="914" y="150" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="1082" y="181" class="cell"><tspan x="1082" dy="0">RAT[x5]=p40</tspan></text><rect x="1256" y="150" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="1424" y="181" class="cell"><tspan x="1424" dy="0">producer in IQ</tspan></text><text x="40" y="267" class="label">lane1 RAW</text><rect x="230" y="224" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="398" y="255" class="cell"><tspan x="398" dy="0">src x5</tspan></text><rect x="572" y="224" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="740" y="255" class="cell"><tspan x="740" dy="0">src=p40 bypass</tspan></text><rect x="914" y="224" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="1082" y="255" class="cell"><tspan x="1082" dy="0">consumer stored</tspan></text><rect x="1256" y="224" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="1424" y="255" class="cell"><tspan x="1424" dy="0">wait p40</tspan></text><text x="40" y="341" class="label">lane1 WAW</text><rect x="230" y="298" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="398" y="329" class="cell"><tspan x="398" dy="0">dst x5</tspan></text><rect x="572" y="298" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="740" y="329" class="cell"><tspan x="740" dy="0">new=p41 stale=p40</tspan></text><rect x="914" y="298" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="1082" y="329" class="cell"><tspan x="1082" dy="0">RAT[x5]=p41</tspan></text><rect x="1256" y="298" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="1424" y="320" class="cell"><tspan x="1424" dy="0">p40 freed at L1</tspan><tspan x="1424" dy="19">commit</tspan></text><text x="40" y="415" class="label">free-list</text><rect x="230" y="372" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="398" y="403" class="cell"><tspan x="398" dy="0">p40,p41 free</tspan></text><rect x="572" y="372" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="740" y="403" class="cell"><tspan x="740" dy="0">reserve both</tspan></text><rect x="914" y="372" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="1082" y="403" class="cell"><tspan x="1082" dy="0">both allocated</tspan></text><rect x="1256" y="372" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="1424" y="403" class="cell"><tspan x="1424" dy="0">no partial state</tspan></text></svg>
