<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="556" viewBox="0 0 1640 556" role="img" aria-labelledby="title desc">
<title id="title">Branch mispredict selective recovery</title><desc id="desc">resolving branch와 older state는 살리고 younger state와 이전 fetch epoch만 제거한다.</desc>
<style>
 .bg{fill:#f8fafc} .grid{fill:#fff;stroke:#64748b;stroke-width:2} .active{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}
 text{font-family:'Noto Sans KR','Malgun Gothic',Arial,sans-serif;fill:#0f172a} .title{font-size:32px;font-weight:700} .caption{font-size:17px;fill:#475569}
 .head{font-size:18px;font-weight:700} .label{font-size:18px;font-weight:700} .cell{font-size:15px}
 @media(prefers-color-scheme:dark){.bg{fill:#0f172a} .grid{fill:#111827;stroke:#94a3b8} .active{fill:#172554;stroke:#60a5fa} text{fill:#e5e7eb} .caption{fill:#cbd5e1}}
</style><rect width="1640" height="556" class="bg"/>
<text x="40" y="48" class="title">Branch mispredict selective recovery</text><text x="40" y="82" class="caption">resolving branch와 older state는 살리고 younger state와 이전 fetch epoch만 제거한다.</text><text x="367.0" y="130" text-anchor="middle" class="head">C0</text><text x="641.0" y="130" text-anchor="middle" class="head">C1</text><text x="915.0" y="130" text-anchor="middle" class="head">C2</text><text x="1189.0" y="130" text-anchor="middle" class="head">C3</text><text x="1463.0" y="130" text-anchor="middle" class="head">C4</text><text x="40" y="193" class="label">Branch seq50</text><rect x="230" y="150" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="364" y="181" class="cell"><tspan x="364" dy="0">issue</tspan></text><rect x="504" y="150" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="638" y="181" class="cell"><tspan x="638" dy="0">resolve wrong</tspan></text><rect x="778" y="150" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="912" y="181" class="cell"><tspan x="912" dy="0">ROB complete</tspan></text><rect x="1052" y="150" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="1186" y="181" class="cell"><tspan x="1186" dy="0">wait/commit</tspan></text><rect x="1326" y="150" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="1460" y="181" class="cell"><tspan x="1460" dy="0">committed</tspan></text><text x="40" y="267" class="label">Younger seq51+</text><rect x="230" y="224" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="364" y="255" class="cell"><tspan x="364" dy="0">spec execute</tspan></text><rect x="504" y="224" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="638" y="255" class="cell"><tspan x="638" dy="0">flush selected</tspan></text><rect x="778" y="224" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="912" y="255" class="cell"><tspan x="912" dy="0">ROB/IQ/LSQ kill</tspan></text><rect x="1052" y="224" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="1186" y="255" class="cell"><tspan x="1186" dy="0">absent</tspan></text><rect x="1326" y="224" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="1460" y="255" class="cell"><tspan x="1460" dy="0">absent</tspan></text><text x="40" y="341" class="label">Rename</text><rect x="230" y="298" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="364" y="329" class="cell"><tspan x="364" dy="0">checkpoint live</tspan></text><rect x="504" y="298" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="638" y="329" class="cell"><tspan x="638" dy="0">restore request</tspan></text><rect x="778" y="298" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="912" y="329" class="cell"><tspan x="912" dy="0">RAT/free restored</tspan></text><rect x="1052" y="298" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="1186" y="329" class="cell"><tspan x="1186" dy="0">new rename</tspan></text><rect x="1326" y="298" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="1460" y="329" class="cell"><tspan x="1460" dy="0">continue</tspan></text><text x="40" y="415" class="label">Frontend</text><rect x="230" y="372" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="364" y="403" class="cell"><tspan x="364" dy="0">old epoch</tspan></text><rect x="504" y="372" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="638" y="403" class="cell"><tspan x="638" dy="0">redirect target</tspan></text><rect x="778" y="372" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="912" y="403" class="cell"><tspan x="912" dy="0">drop stale rsp</tspan></text><rect x="1052" y="372" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="1186" y="403" class="cell"><tspan x="1186" dy="0">target fetch</tspan></text><rect x="1326" y="372" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="1460" y="403" class="cell"><tspan x="1460" dy="0">new instructions</tspan></text></svg>
