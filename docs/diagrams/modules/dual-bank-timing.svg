<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="556" viewBox="0 0 1640 556" role="img" aria-labelledby="title desc">
<title id="title">Dual LSU와 2-bank 1R1W TIM</title><desc id="desc">서로 다른 bank 요청은 병렬이고 같은 bank 요청은 older one만 grant되어 younger가 payload를 유지한다.</desc>
<style>
 .bg{fill:#f8fafc} .grid{fill:#fff;stroke:#64748b;stroke-width:2} .active{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}
 text{font-family:'Noto Sans KR','Malgun Gothic',Arial,sans-serif;fill:#0f172a} .title{font-size:32px;font-weight:700} .caption{font-size:17px;fill:#475569}
 .head{font-size:18px;font-weight:700} .label{font-size:18px;font-weight:700} .cell{font-size:15px}
 @media(prefers-color-scheme:dark){.bg{fill:#0f172a} .grid{fill:#111827;stroke:#94a3b8} .active{fill:#172554;stroke:#60a5fa} text{fill:#e5e7eb} .caption{fill:#cbd5e1}}
</style><rect width="1640" height="556" class="bg"/>
<text x="40" y="48" class="title">Dual LSU와 2-bank 1R1W TIM</text><text x="40" y="82" class="caption">서로 다른 bank 요청은 병렬이고 같은 bank 요청은 older one만 grant되어 younger가 payload를 유지한다.</text><text x="401.0" y="130" text-anchor="middle" class="head">C0</text><text x="743.0" y="130" text-anchor="middle" class="head">C1</text><text x="1085.0" y="130" text-anchor="middle" class="head">C2</text><text x="1427.0" y="130" text-anchor="middle" class="head">C3</text><text x="40" y="193" class="label">different banks</text><rect x="230" y="150" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="398" y="181" class="cell"><tspan x="398" dy="0">LSU0 B0 + LSU1 B1</tspan></text><rect x="572" y="150" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="740" y="181" class="cell"><tspan x="740" dy="0">both grant</tspan></text><rect x="914" y="150" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="1082" y="181" class="cell"><tspan x="1082" dy="0">both read rsp</tspan></text><rect x="1256" y="150" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="1424" y="181" class="cell"><tspan x="1424" dy="0">both complete</tspan></text><text x="40" y="267" class="label">same bank LSU0</text><rect x="230" y="224" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="398" y="255" class="cell"><tspan x="398" dy="0">older B0</tspan></text><rect x="572" y="224" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="740" y="255" class="cell"><tspan x="740" dy="0">grant</tspan></text><rect x="914" y="224" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="1082" y="255" class="cell"><tspan x="1082" dy="0">read rsp</tspan></text><rect x="1256" y="224" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="1424" y="255" class="cell"><tspan x="1424" dy="0">complete</tspan></text><text x="40" y="341" class="label">same bank LSU1</text><rect x="230" y="298" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="398" y="329" class="cell"><tspan x="398" dy="0">younger B0</tspan></text><rect x="572" y="298" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="740" y="329" class="cell"><tspan x="740" dy="0">ready=0 hold</tspan></text><rect x="914" y="298" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="1082" y="329" class="cell"><tspan x="1082" dy="0">retry grant</tspan></text><rect x="1256" y="298" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="1424" y="329" class="cell"><tspan x="1424" dy="0">read rsp</tspan></text><text x="40" y="415" class="label">payload rule</text><rect x="230" y="372" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="398" y="403" class="cell"><tspan x="398" dy="0">stable</tspan></text><rect x="572" y="372" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="740" y="403" class="cell"><tspan x="740" dy="0">stable while stalled</tspan></text><rect x="914" y="372" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="1082" y="403" class="cell"><tspan x="1082" dy="0">accepted</tspan></text><rect x="1256" y="372" width="336" height="66" rx="5" class="active"/><text text-anchor="middle" x="1424" y="403" class="cell"><tspan x="1424" dy="0">identity preserved</tspan></text></svg>
