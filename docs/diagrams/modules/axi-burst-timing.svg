<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="556" viewBox="0 0 1640 556" role="img" aria-labelledby="title desc">
<title id="title">AXI inbound burst와 오류 선검사</title><desc id="desc">target/window/4-KiB 검사는 첫 local beat 전에 끝나므로 invalid burst는 partial write를 만들지 않는다.</desc>
<style>
 .bg{fill:#f8fafc} .grid{fill:#fff;stroke:#64748b;stroke-width:2} .active{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}
 text{font-family:'Noto Sans KR','Malgun Gothic',Arial,sans-serif;fill:#0f172a} .title{font-size:32px;font-weight:700} .caption{font-size:17px;fill:#475569}
 .head{font-size:18px;font-weight:700} .label{font-size:18px;font-weight:700} .cell{font-size:15px}
 @media(prefers-color-scheme:dark){.bg{fill:#0f172a} .grid{fill:#111827;stroke:#94a3b8} .active{fill:#172554;stroke:#60a5fa} text{fill:#e5e7eb} .caption{fill:#cbd5e1}}
</style><rect width="1640" height="556" class="bg"/>
<text x="40" y="48" class="title">AXI inbound burst와 오류 선검사</text><text x="40" y="82" class="caption">target/window/4-KiB 검사는 첫 local beat 전에 끝나므로 invalid burst는 partial write를 만들지 않는다.</text><text x="344.0" y="130" text-anchor="middle" class="head">C0</text><text x="572.0" y="130" text-anchor="middle" class="head">C1</text><text x="800.0" y="130" text-anchor="middle" class="head">C2</text><text x="1028.0" y="130" text-anchor="middle" class="head">C3</text><text x="1256.0" y="130" text-anchor="middle" class="head">C4</text><text x="1484.0" y="130" text-anchor="middle" class="head">C5</text><text x="40" y="193" class="label">AXI AR/AW</text><rect x="230" y="150" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="341" y="181" class="cell"><tspan x="341" dy="0">valid</tspan></text><rect x="458" y="150" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="569" y="181" class="cell"><tspan x="569" dy="0">handshake+precheck</tspan></text><rect x="686" y="150" width="222" height="66" rx="5" class="grid"/><text text-anchor="middle" x="797" y="181" class="cell"><tspan x="797" dy="0">—</tspan></text><rect x="914" y="150" width="222" height="66" rx="5" class="grid"/><text text-anchor="middle" x="1025" y="181" class="cell"><tspan x="1025" dy="0">—</tspan></text><rect x="1142" y="150" width="222" height="66" rx="5" class="grid"/><text text-anchor="middle" x="1253" y="181" class="cell"><tspan x="1253" dy="0">—</tspan></text><rect x="1370" y="150" width="222" height="66" rx="5" class="grid"/><text text-anchor="middle" x="1481" y="181" class="cell"><tspan x="1481" dy="0">—</tspan></text><text x="40" y="267" class="label">valid burst</text><rect x="230" y="224" width="222" height="66" rx="5" class="grid"/><text text-anchor="middle" x="341" y="255" class="cell"><tspan x="341" dy="0">—</tspan></text><rect x="458" y="224" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="569" y="255" class="cell"><tspan x="569" dy="0">beat0 req</tspan></text><rect x="686" y="224" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="797" y="255" class="cell"><tspan x="797" dy="0">beat0 rsp</tspan></text><rect x="914" y="224" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1025" y="255" class="cell"><tspan x="1025" dy="0">beat1 req</tspan></text><rect x="1142" y="224" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1253" y="255" class="cell"><tspan x="1253" dy="0">beat1 rsp</tspan></text><rect x="1370" y="224" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1481" y="255" class="cell"><tspan x="1481" dy="0">RLast/B</tspan></text><text x="40" y="341" class="label">invalid burst</text><rect x="230" y="298" width="222" height="66" rx="5" class="grid"/><text text-anchor="middle" x="341" y="329" class="cell"><tspan x="341" dy="0">—</tspan></text><rect x="458" y="298" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="569" y="329" class="cell"><tspan x="569" dy="0">route error</tspan></text><rect x="686" y="298" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="797" y="329" class="cell"><tspan x="797" dy="0">DECERR beat0</tspan></text><rect x="914" y="298" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1025" y="329" class="cell"><tspan x="1025" dy="0">DECERR beat1</tspan></text><rect x="1142" y="298" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1253" y="329" class="cell"><tspan x="1253" dy="0">done</tspan></text><rect x="1370" y="298" width="222" height="66" rx="5" class="grid"/><text text-anchor="middle" x="1481" y="329" class="cell"><tspan x="1481" dy="0">—</tspan></text><text x="40" y="415" class="label">local side effect</text><rect x="230" y="372" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="341" y="403" class="cell"><tspan x="341" dy="0">0</tspan></text><rect x="458" y="372" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="569" y="394" class="cell"><tspan x="569" dy="0">valid: req /</tspan><tspan x="569" dy="19">invalid:0</tspan></text><rect x="686" y="372" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="797" y="403" class="cell"><tspan x="797" dy="0">valid only</tspan></text><rect x="914" y="372" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1025" y="403" class="cell"><tspan x="1025" dy="0">valid only</tspan></text><rect x="1142" y="372" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1253" y="403" class="cell"><tspan x="1253" dy="0">valid only</tspan></text><rect x="1370" y="372" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1481" y="403" class="cell"><tspan x="1481" dy="0">0</tspan></text></svg>
