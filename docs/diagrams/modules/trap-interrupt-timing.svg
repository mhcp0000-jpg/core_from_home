<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="556" viewBox="0 0 1640 556" role="img" aria-labelledby="title desc">
<title id="title">Precise exception과 interrupt 경계</title><desc id="desc">동기 exception은 ROB head에서 우선하고 interrupt는 ROB가 비어 architectural boundary가 된 뒤 수락한다.</desc>
<style>
 .bg{fill:#f8fafc} .grid{fill:#fff;stroke:#64748b;stroke-width:2} .active{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}
 text{font-family:'Noto Sans KR','Malgun Gothic',Arial,sans-serif;fill:#0f172a} .title{font-size:32px;font-weight:700} .caption{font-size:17px;fill:#475569}
 .head{font-size:18px;font-weight:700} .label{font-size:18px;font-weight:700} .cell{font-size:15px}
 @media(prefers-color-scheme:dark){.bg{fill:#0f172a} .grid{fill:#111827;stroke:#94a3b8} .active{fill:#172554;stroke:#60a5fa} text{fill:#e5e7eb} .caption{fill:#cbd5e1}}
</style><rect width="1640" height="556" class="bg"/>
<text x="40" y="48" class="title">Precise exception과 interrupt 경계</text><text x="40" y="82" class="caption">동기 exception은 ROB head에서 우선하고 interrupt는 ROB가 비어 architectural boundary가 된 뒤 수락한다.</text><text x="344.0" y="130" text-anchor="middle" class="head">C0</text><text x="572.0" y="130" text-anchor="middle" class="head">C1</text><text x="800.0" y="130" text-anchor="middle" class="head">C2</text><text x="1028.0" y="130" text-anchor="middle" class="head">C3</text><text x="1256.0" y="130" text-anchor="middle" class="head">C4</text><text x="1484.0" y="130" text-anchor="middle" class="head">C5</text><text x="40" y="193" class="label">ROB</text><rect x="230" y="150" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="341" y="181" class="cell"><tspan x="341" dy="0">older retire</tspan></text><rect x="458" y="150" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="569" y="181" class="cell"><tspan x="569" dy="0">fault at head</tspan></text><rect x="686" y="150" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="797" y="181" class="cell"><tspan x="797" dy="0">flush all</tspan></text><rect x="914" y="150" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1025" y="181" class="cell"><tspan x="1025" dy="0">empty</tspan></text><rect x="1142" y="150" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1253" y="181" class="cell"><tspan x="1253" dy="0">handler fetch</tspan></text><rect x="1370" y="150" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1481" y="181" class="cell"><tspan x="1481" dy="0">handler run</tspan></text><text x="40" y="267" class="label">Interrupt</text><rect x="230" y="224" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="341" y="255" class="cell"><tspan x="341" dy="0">pending</tspan></text><rect x="458" y="224" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="569" y="255" class="cell"><tspan x="569" dy="0">pending but loses</tspan></text><rect x="686" y="224" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="797" y="255" class="cell"><tspan x="797" dy="0">still pending</tspan></text><rect x="914" y="224" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1025" y="255" class="cell"><tspan x="1025" dy="0">MIE cleared</tspan></text><rect x="1142" y="224" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1253" y="255" class="cell"><tspan x="1253" dy="0">masked</tspan></text><rect x="1370" y="224" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1481" y="255" class="cell"><tspan x="1481" dy="0">software policy</tspan></text><text x="40" y="341" class="label">CSR</text><rect x="230" y="298" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="341" y="329" class="cell"><tspan x="341" dy="0">unchanged</tspan></text><rect x="458" y="298" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="569" y="329" class="cell"><tspan x="569" dy="0">trap handshake</tspan></text><rect x="686" y="298" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="797" y="329" class="cell"><tspan x="797" dy="0">mepc/cause/tval</tspan></text><rect x="914" y="298" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1025" y="329" class="cell"><tspan x="1025" dy="0">M-mode</tspan></text><rect x="1142" y="298" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1253" y="329" class="cell"><tspan x="1253" dy="0">handler state</tspan></text><rect x="1370" y="298" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1481" y="329" class="cell"><tspan x="1481" dy="0">save context</tspan></text><text x="40" y="415" class="label">Frontend</text><rect x="230" y="372" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="341" y="403" class="cell"><tspan x="341" dy="0">normal</tspan></text><rect x="458" y="372" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="569" y="403" class="cell"><tspan x="569" dy="0">stop</tspan></text><rect x="686" y="372" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="797" y="403" class="cell"><tspan x="797" dy="0">redirect mtvec</tspan></text><rect x="914" y="372" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1025" y="403" class="cell"><tspan x="1025" dy="0">request handler</tspan></text><rect x="1142" y="372" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1253" y="403" class="cell"><tspan x="1253" dy="0">response</tspan></text><rect x="1370" y="372" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1481" y="403" class="cell"><tspan x="1481" dy="0">decode handler</tspan></text></svg>
