<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="556" viewBox="0 0 1640 556" role="img" aria-labelledby="title desc">
<title id="title">ROB OoO 완료와 in-order dual commit</title><desc id="desc">younger ADD가 먼저 완료돼도 older DIV가 끝나기 전에는 commit하지 못한다.</desc>
<style>
 .bg{fill:#f8fafc} .grid{fill:#fff;stroke:#64748b;stroke-width:2} .active{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}
 text{font-family:'Noto Sans KR','Malgun Gothic',Arial,sans-serif;fill:#0f172a} .title{font-size:32px;font-weight:700} .caption{font-size:17px;fill:#475569}
 .head{font-size:18px;font-weight:700} .label{font-size:18px;font-weight:700} .cell{font-size:15px}
 @media(prefers-color-scheme:dark){.bg{fill:#0f172a} .grid{fill:#111827;stroke:#94a3b8} .active{fill:#172554;stroke:#60a5fa} text{fill:#e5e7eb} .caption{fill:#cbd5e1}}
</style><rect width="1640" height="556" class="bg"/>
<text x="40" y="48" class="title">ROB OoO 완료와 in-order dual commit</text><text x="40" y="82" class="caption">younger ADD가 먼저 완료돼도 older DIV가 끝나기 전에는 commit하지 못한다.</text><text x="344.0" y="130" text-anchor="middle" class="head">C0</text><text x="572.0" y="130" text-anchor="middle" class="head">C1</text><text x="800.0" y="130" text-anchor="middle" class="head">C2</text><text x="1028.0" y="130" text-anchor="middle" class="head">C3…C32</text><text x="1256.0" y="130" text-anchor="middle" class="head">C33</text><text x="1484.0" y="130" text-anchor="middle" class="head">C34</text><text x="40" y="193" class="label">DIV seq40</text><rect x="230" y="150" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="341" y="181" class="cell"><tspan x="341" dy="0">allocate</tspan></text><rect x="458" y="150" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="569" y="181" class="cell"><tspan x="569" dy="0">issue</tspan></text><rect x="686" y="150" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="797" y="181" class="cell"><tspan x="797" dy="0">busy</tspan></text><rect x="914" y="150" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1025" y="181" class="cell"><tspan x="1025" dy="0">iterate</tspan></text><rect x="1142" y="150" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1253" y="181" class="cell"><tspan x="1253" dy="0">WB complete</tspan></text><rect x="1370" y="150" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1481" y="181" class="cell"><tspan x="1481" dy="0">commit L0</tspan></text><text x="40" y="267" class="label">ADD seq41</text><rect x="230" y="224" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="341" y="255" class="cell"><tspan x="341" dy="0">allocate</tspan></text><rect x="458" y="224" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="569" y="255" class="cell"><tspan x="569" dy="0">issue</tspan></text><rect x="686" y="224" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="797" y="255" class="cell"><tspan x="797" dy="0">WB complete</tspan></text><rect x="914" y="224" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1025" y="255" class="cell"><tspan x="1025" dy="0">ROB wait</tspan></text><rect x="1142" y="224" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1253" y="255" class="cell"><tspan x="1253" dy="0">complete</tspan></text><rect x="1370" y="224" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1481" y="255" class="cell"><tspan x="1481" dy="0">commit L1</tspan></text><text x="40" y="341" class="label">ROB head</text><rect x="230" y="298" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="341" y="329" class="cell"><tspan x="341" dy="0">seq40</tspan></text><rect x="458" y="298" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="569" y="329" class="cell"><tspan x="569" dy="0">seq40</tspan></text><rect x="686" y="298" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="797" y="329" class="cell"><tspan x="797" dy="0">seq40 incomplete</tspan></text><rect x="914" y="298" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1025" y="329" class="cell"><tspan x="1025" dy="0">seq40 incomplete</tspan></text><rect x="1142" y="298" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1253" y="329" class="cell"><tspan x="1253" dy="0">both complete</tspan></text><rect x="1370" y="298" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1481" y="329" class="cell"><tspan x="1481" dy="0">head+=2</tspan></text><text x="40" y="415" class="label">Architectural</text><rect x="230" y="372" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="341" y="403" class="cell"><tspan x="341" dy="0">no change</tspan></text><rect x="458" y="372" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="569" y="403" class="cell"><tspan x="569" dy="0">no change</tspan></text><rect x="686" y="372" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="797" y="403" class="cell"><tspan x="797" dy="0">ADD not visible</tspan></text><rect x="914" y="372" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1025" y="403" class="cell"><tspan x="1025" dy="0">ADD not visible</tspan></text><rect x="1142" y="372" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1253" y="403" class="cell"><tspan x="1253" dy="0">no change</tspan></text><rect x="1370" y="372" width="222" height="66" rx="5" class="active"/><text text-anchor="middle" x="1481" y="403" class="cell"><tspan x="1481" dy="0">x5 then x6</tspan></text></svg>
