<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="556" viewBox="0 0 1640 556" role="img" aria-labelledby="title desc">
<title id="title">Store-to-load forwarding</title><desc id="desc">load는 모든 older store 주소를 확인하고 youngest full-cover store data만 사용한다.</desc>
<style>
 .bg{fill:#f8fafc} .grid{fill:#fff;stroke:#64748b;stroke-width:2} .active{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}
 text{font-family:'Noto Sans KR','Malgun Gothic',Arial,sans-serif;fill:#0f172a} .title{font-size:32px;font-weight:700} .caption{font-size:17px;fill:#475569}
 .head{font-size:18px;font-weight:700} .label{font-size:18px;font-weight:700} .cell{font-size:15px}
 @media(prefers-color-scheme:dark){.bg{fill:#0f172a} .grid{fill:#111827;stroke:#94a3b8} .active{fill:#172554;stroke:#60a5fa} text{fill:#e5e7eb} .caption{fill:#cbd5e1}}
</style><rect width="1640" height="556" class="bg"/>
<text x="40" y="48" class="title">Store-to-load forwarding</text><text x="40" y="82" class="caption">load는 모든 older store 주소를 확인하고 youngest full-cover store data만 사용한다.</text><text x="367.0" y="130" text-anchor="middle" class="head">C0</text><text x="641.0" y="130" text-anchor="middle" class="head">C1</text><text x="915.0" y="130" text-anchor="middle" class="head">C2</text><text x="1189.0" y="130" text-anchor="middle" class="head">C3</text><text x="1463.0" y="130" text-anchor="middle" class="head">C4</text><text x="40" y="193" class="label">Store seq60</text><rect x="230" y="150" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="364" y="181" class="cell"><tspan x="364" dy="0">SQ allocate</tspan></text><rect x="504" y="150" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="638" y="181" class="cell"><tspan x="638" dy="0">AGU address</tspan></text><rect x="778" y="150" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="912" y="181" class="cell"><tspan x="912" dy="0">SQ addr/data ready</tspan></text><rect x="1052" y="150" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="1186" y="181" class="cell"><tspan x="1186" dy="0">still speculative</tspan></text><rect x="1326" y="150" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="1460" y="181" class="cell"><tspan x="1460" dy="0">commit→SB</tspan></text><text x="40" y="267" class="label">Load seq61</text><rect x="230" y="224" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="364" y="255" class="cell"><tspan x="364" dy="0">LQ allocate</tspan></text><rect x="504" y="224" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="638" y="255" class="cell"><tspan x="638" dy="0">AGU address</tspan></text><rect x="778" y="224" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="912" y="255" class="cell"><tspan x="912" dy="0">order check</tspan></text><rect x="1052" y="224" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="1186" y="255" class="cell"><tspan x="1186" dy="0">forward complete</tspan></text><rect x="1326" y="224" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="1460" y="255" class="cell"><tspan x="1460" dy="0">ROB complete</tspan></text><text x="40" y="341" class="label">D-memory read</text><rect x="230" y="298" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="364" y="329" class="cell"><tspan x="364" dy="0">none</tspan></text><rect x="504" y="298" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="638" y="329" class="cell"><tspan x="638" dy="0">none</tspan></text><rect x="778" y="298" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="912" y="329" class="cell"><tspan x="912" dy="0">blocked until check</tspan></text><rect x="1052" y="298" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="1186" y="329" class="cell"><tspan x="1186" dy="0">none: forwarded</tspan></text><rect x="1326" y="298" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="1460" y="329" class="cell"><tspan x="1460" dy="0">none</tspan></text><text x="40" y="415" class="label">Visibility</text><rect x="230" y="372" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="364" y="403" class="cell"><tspan x="364" dy="0">no write</tspan></text><rect x="504" y="372" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="638" y="403" class="cell"><tspan x="638" dy="0">no write</tspan></text><rect x="778" y="372" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="912" y="403" class="cell"><tspan x="912" dy="0">no write</tspan></text><rect x="1052" y="372" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="1186" y="403" class="cell"><tspan x="1186" dy="0">no write</tspan></text><rect x="1326" y="372" width="268" height="66" rx="5" class="active"/><text text-anchor="middle" x="1460" y="403" class="cell"><tspan x="1460" dy="0">SB may write</tspan></text></svg>
