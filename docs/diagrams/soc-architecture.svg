<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1560" role="img" aria-labelledby="title desc">
  <title id="title">RV32IMFC OoO SoC connection contract</title>
  <desc id="desc">Two-panel left-to-right diagram. The upper panel shows local core paths. The lower panel shows all AXI bridges and crossbar targets. Boot ROM and ITIM are behind the instruction arbiter. DTIM and CLINT are behind the data arbiter.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L11 6L1 11Z" fill="context-stroke"/></marker>
    <style>
      .bg{fill:#fff}.panel{fill:#f8fafc;stroke:#94a3b8;stroke-width:3;rx:16}.core{fill:#eaf2ff;stroke:#2563eb}.ifab{fill:#ecfdf5;stroke:#047857}.dfab{fill:#eff6ff;stroke:#0369a1}.axi{fill:#fff7ed;stroke:#c2410c}.host{fill:#f5f3ff;stroke:#7c3aed}.err{fill:#fef2f2;stroke:#b91c1c}.node{stroke-width:4;rx:12}.wire{fill:none;stroke:#334155;stroke-width:6;stroke-linecap:square;stroke-linejoin:round;marker-end:url(#arrow)}.wi{stroke:#047857}.wd{stroke:#0369a1}.wa{stroke:#c2410c}.wx{stroke:#7c3aed}.title{font:500 34px system-ui,sans-serif;fill:#0f172a}.subtitle{font:400 19px system-ui,sans-serif;fill:#475569}.panel-title{font:500 25px system-ui,sans-serif;fill:#334155}.name{font:500 21px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#0f172a;text-anchor:middle}.role{font:500 19px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.detail{font:400 17px system-ui,sans-serif;fill:#475569;text-anchor:middle}.port{font:500 18px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#334155;text-anchor:middle}.edge{font:500 17px system-ui,sans-serif;fill:#334155;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:7px}.note{font:500 18px system-ui,sans-serif;fill:#7c2d12}@media(prefers-color-scheme:dark){.bg{fill:#0f172a}.panel{fill:#111827;stroke:#64748b}.core{fill:#172554;stroke:#60a5fa}.ifab{fill:#052e2b;stroke:#34d399}.dfab{fill:#082f49;stroke:#38bdf8}.axi{fill:#431407;stroke:#fb923c}.host{fill:#2e1065;stroke:#a78bfa}.err{fill:#450a0a;stroke:#f87171}.wire{stroke:#cbd5e1}.wi{stroke:#6ee7b7}.wd{stroke:#7dd3fc}.wa{stroke:#fdba74}.wx{stroke:#c4b5fd}.title,.name,.role{fill:#f8fafc}.subtitle,.panel-title,.detail,.port{fill:#cbd5e1}.edge{fill:#e2e8f0;stroke:#0f172a}.note{fill:#fdba74}}
    </style>
  </defs>
  <rect class="bg" width="1900" height="1560"/>
  <text class="title" x="40" y="50">RV32IMFC OoO SoC connection contract</text>
  <text class="subtitle" x="40" y="80">Every transaction flows left → right. Panel A and Panel B reference the same I/D-Fabric through their named ports.</text>

  <!-- Panel A -->
  <rect class="panel" x="30" y="105" width="1840" height="600"/>
  <text class="panel-title" x="55" y="145">A. Core-local fast paths — Main Xbar is bypassed</text>

  <rect class="node core" x="75" y="220" width="330" height="120"/>
  <text class="name" x="240" y="255">u_core : rv_ooo_core</text><text class="role" x="240" y="285">IFU 128-bit block port</text><text class="detail" x="240" y="315">reset PC = BOOTROM_BASE_ADDR</text>
  <rect class="node ifab" x="520" y="220" width="430" height="120"/>
  <text class="name" x="735" y="255">u_i_fabric : rv_i_fabric</text><text class="role" x="735" y="285">I-Arbiter + local address decode</text><text class="detail" x="735" y="315">IFU request / 128-bit response mux</text>
  <rect class="node ifab" x="1100" y="165" width="650" height="115"/>
  <text class="name" x="1425" y="200">u_bootrom_local</text><text class="detail" x="1425" y="230">0x0000_1000 · 4 KiB · read-only local target</text><text class="detail" x="1425" y="257">reset fetch terminates here without AXI</text>
  <rect class="node ifab" x="1100" y="310" width="650" height="115"/>
  <text class="name" x="1425" y="345">u_itim</text><text class="detail" x="1425" y="375">0x8000_0000 · 128 KiB · 2-bank 1R1W SRAM</text><text class="detail" x="1425" y="402">normal program fetch terminates here without AXI</text>
  <path class="wire wi" d="M405 280H520"/><text class="edge" x="463" y="263">IFU</text>
  <path class="wire wi" d="M950 260H1030V223H1100"/><path class="wire wi" d="M950 300H1030V368H1100"/>
  <text class="edge" x="1015" y="205">Boot hit</text><text class="edge" x="1015" y="395">ITIM hit</text>

  <rect class="node core" x="75" y="500" width="330" height="120"/>
  <text class="name" x="240" y="535">u_core : dual LSU</text><text class="role" x="240" y="565">LSU0 + LSU1 64-bit ports</text><text class="detail" x="240" y="595">LSQ ordering before D-Fabric</text>
  <rect class="node dfab" x="520" y="500" width="430" height="120"/>
  <text class="name" x="735" y="535">u_d_fabric : rv_d_fabric</text><text class="role" x="735" y="565">D-Arbiter + bank/device decode</text><text class="detail" x="735" y="595">initiators: LSU0 · LSU1 · inbound</text>
  <rect class="node dfab" x="1100" y="455" width="650" height="105"/>
  <text class="name" x="1425" y="488">u_dtim</text><text class="detail" x="1425" y="518">0x8002_0000 · 128 KiB · 2-bank 1R1W SRAM</text><text class="detail" x="1425" y="543">normal load/store local target</text>
  <rect class="node dfab" x="1100" y="585" width="650" height="105"/>
  <text class="name" x="1425" y="618">u_clint</text><text class="detail" x="1425" y="648">0x0020_0000 · 64 KiB · MSIP/MTIP/MTIME</text><text class="detail" x="1425" y="673">device-ordered local target</text>
  <path class="wire wd" d="M405 535H520"/><path class="wire wd" d="M405 585H520"/>
  <text class="edge" x="463" y="518">LSU0</text><text class="edge" x="463" y="615">LSU1</text>
  <path class="wire wd" d="M950 540H1030V508H1100"/><path class="wire wd" d="M950 580H1030V638H1100"/>
  <text class="edge" x="1015" y="490">DTIM hit</text><text class="edge" x="1015" y="665">CLINT hit</text>

  <!-- Panel B -->
  <g transform="translate(0 100)">
  <rect class="panel" x="30" y="635" width="1840" height="735"/>
  <text class="panel-title" x="55" y="675">B. Global AXI4 paths — all bridges and target directions are explicit</text>
  <text class="port" x="180" y="735">Sources</text><text class="port" x="475" y="735">local → AXI4</text><text class="port" x="850" y="715">Main AXI4 Crossbar</text><text class="port" x="1200" y="715">AXI4 → local</text><text class="port" x="1590" y="715">Final target</text>

  <rect class="node ifab" x="60" y="765" width="240" height="80"/><text class="name" x="180" y="797">I-Fabric OUT</text><text class="detail" x="180" y="825">non-local fetch</text>
  <rect class="node dfab" x="60" y="885" width="240" height="80"/><text class="name" x="180" y="917">D-Fabric OUT</text><text class="detail" x="180" y="945">non-local LSU</text>
  <rect class="node host" x="60" y="1005" width="240" height="80"/><text class="name" x="180" y="1037">DPI Host BFM</text><text class="detail" x="180" y="1065">host_axi_s</text>

  <rect class="node axi" x="345" y="765" width="265" height="80"/><text class="name" x="478" y="797">u_i_outbound_bridge</text><text class="detail" x="478" y="825">rv_local_to_axi_bridge</text>
  <rect class="node axi" x="345" y="885" width="265" height="80"/><text class="name" x="478" y="917">u_d_outbound_bridge</text><text class="detail" x="478" y="945">rv_local_to_axi_bridge</text>

  <rect class="node axi" x="700" y="750" width="300" height="570"/>
  <text class="name" x="850" y="788">u_main_xbar</text><text class="role" x="850" y="820">rv_axi_xbar</text><text class="detail" x="850" y="850">3 masters · 6 target ports</text>
  <text class="port" x="745" y="900">M0</text><text class="port" x="745" y="965">M1</text><text class="port" x="745" y="1030">M2</text>
  <text class="port" x="952" y="800">S0</text><text class="port" x="952" y="925">S1</text><text class="port" x="952" y="1035">S2</text><text class="port" x="952" y="1125">S3</text><text class="port" x="952" y="1215">S4</text><text class="port" x="952" y="1295">S5</text>

  <rect class="node axi" x="1060" y="750" width="285" height="95"/><text class="name" x="1203" y="785">u_i_inbound_bridge</text><text class="detail" x="1203" y="815">AXI4 → local · 2 windows</text>
  <rect class="node axi" x="1060" y="875" width="285" height="95"/><text class="name" x="1203" y="910">u_d_inbound_bridge</text><text class="detail" x="1203" y="940">AXI4 → local · 2 windows</text>

  <rect class="node ifab" x="1410" y="750" width="360" height="95"/><text class="name" x="1590" y="785">I-Fabric IN → I-Arbiter</text><text class="detail" x="1590" y="815">Boot ROM or ITIM</text>
  <rect class="node dfab" x="1410" y="875" width="360" height="95"/><text class="name" x="1590" y="910">D-Fabric IN → D-Arbiter</text><text class="detail" x="1590" y="940">DTIM or CLINT</text>
  <rect class="node host" x="1410" y="1000" width="360" height="70"/><text class="name" x="1590" y="1030">u_plic</text><text class="detail" x="1590" y="1054">S2 · 0x0C00_0000</text>
  <rect class="node host" x="1410" y="1090" width="360" height="70"/><text class="name" x="1590" y="1120">u_hostif</text><text class="detail" x="1590" y="1144">S3 · 0x1000_0000</text>
  <rect class="node err" x="1410" y="1180" width="360" height="70"/><text class="name" x="1590" y="1210">reserved error target</text><text class="detail" x="1590" y="1234">S4 · explicit DECERR</text>
  <rect class="node err" x="1410" y="1270" width="360" height="70"/><text class="name" x="1590" y="1300">default error target</text><text class="detail" x="1590" y="1324">S5 · unmapped / invalid burst</text>

  <!-- Sources flow only left to right -->
  <path class="wire wa" d="M300 805H345"/><path class="wire wa" d="M610 805H660V900H700"/>
  <path class="wire wa" d="M300 925H345"/><path class="wire wa" d="M610 925H700"/>
  <path class="wire wx" d="M300 1045H660V1030H700"/>

  <!-- Targets flow only left to right -->
  <path class="wire wx" d="M1000 800H1060"/><path class="wire wx" d="M1345 798H1410"/>
  <path class="wire wx" d="M1000 925H1060"/><path class="wire wx" d="M1345 923H1410"/>
  <path class="wire wx" d="M1000 1035H1410"/><path class="wire wx" d="M1000 1125H1410"/>
  <path class="wire wx" d="M1000 1215H1410"/><path class="wire wx" d="M1000 1295H1410"/>
  <text class="edge" x="1205" y="1018">S2 direct AXI</text><text class="edge" x="1205" y="1108">S3 direct AXI</text>
  </g>

  <text class="note" x="55" y="1505">Rule: Main Xbar never drives Boot ROM, ITIM, DTIM, or CLINT directly. S0/S1 always pass through inbound bridge → local Arbiter → selected target.</text>
  <text class="subtitle" x="55" y="1535">Xbar decode: S0=Boot ROM+ITIM · S1=DTIM+CLINT · S2=PLIC · S3=HostIF · S4=reserved error · S5=default DECERR.</text>
</svg>
